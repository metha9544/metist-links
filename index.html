<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f0">
  <meta name="description" content="METIST — ลิงก์สำหรับสั่งซื้อ สร้างใบปะหน้า และติดต่อร้าน">
  <title>METIST | Links</title>
  <style>
    :root{
      --ink:#111;
      --muted:#746f67;
      --line:#d8d3ca;
      --cream:#f7f5f0;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:linear-gradient(180deg,#faf8f4 0%,#f0ece4 100%);
      color:var(--ink);
      padding:20px 18px 42px;
    }
    .wrap{width:100%;max-width:520px;margin:0 auto}

    /* ข้อความแนะนำสำหรับ TikTok / in-app browser */
    .browser-hint{
      position:relative;
      min-height:88px;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding:8px 72px 6px 8px;
      text-align:center;
      pointer-events:none;
    }
    .browser-hint .text{
      font-size:19px;
      line-height:1.25;
      font-weight:800;
      color:#111;
      text-shadow:0 1px 0 rgba(255,255,255,.9);
    }
    .browser-hint .arrow{
      position:absolute;
      right:4px;
      top:0;
      width:76px;
      height:62px;
      transform:rotate(-8deg);
    }
    .browser-hint .arrow:before{
      content:"";
      position:absolute;
      left:3px;
      bottom:8px;
      width:56px;
      height:18px;
      border-top:9px solid #111;
      border-radius:55% 55% 0 0;
      transform:rotate(-34deg);
    }
    .browser-hint .arrow:after{
      content:"";
      position:absolute;
      right:1px;
      top:0;
      width:0;
      height:0;
      border-left:16px solid transparent;
      border-right:16px solid transparent;
      border-bottom:29px solid #111;
      transform:rotate(42deg);
    }

    .hero{text-align:center;padding:12px 10px 26px}
    .logo{
      width:116px;
      height:116px;
      border-radius:50%;
      object-fit:cover;
      display:block;
      margin:0 auto 18px;
      box-shadow:0 8px 24px rgba(0,0,0,.08);
      background:#eee;
    }
    h1{
      margin:0;
      font-size:30px;
      letter-spacing:.14em;
      font-weight:750;
    }
    .sub{
      margin:10px auto 0;
      color:var(--muted);
      font-size:15px;
      line-height:1.55;
      max-width:360px;
    }

    .links{display:grid;gap:14px}
    .link{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      text-decoration:none;
      color:var(--ink);
      background:rgba(255,255,255,.96);
      border:1px solid var(--line);
      border-radius:22px;
      padding:18px 18px;
      min-height:86px;
      box-shadow:0 8px 24px rgba(0,0,0,.035);
      transition:transform .15s ease,box-shadow .15s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .link:active{transform:scale(.985)}
    .left{display:flex;align-items:center;gap:13px;min-width:0}
    .icon{
      width:48px;
      height:48px;
      border-radius:14px;
      background:#f0ede7;
      display:grid;
      place-items:center;
      font-size:22px;
      flex:0 0 auto;
    }
    .txt{min-width:0}
    .title{font-weight:750;font-size:18px}
    .desc{
      font-size:13px;
      color:var(--muted);
      margin-top:4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .arrow-link{font-size:28px;color:#8a847a;padding-left:4px}

    footer{
      text-align:center;
      color:#928b80;
      font-size:12px;
      margin-top:30px;
    }

    @media (max-width:380px){
      .browser-hint .text{font-size:17px}
      .browser-hint{padding-right:62px}
      .logo{width:104px;height:104px}
      .title{font-size:17px}
    }
  </style>
</head>
<body>
  <main class="wrap">

    <div class="browser-hint" aria-label="คำแนะนำการเปิดในเบราว์เซอร์">
      <div class="text">กดเปิดในเบราว์เซอร์ก่อน</div>
      <div class="arrow" aria-hidden="true"></div>
    </div>

    <section class="hero">
      <img class="logo" src="IMG_0296.jpeg" alt="METIST">
      <h1>METIST</h1>
      <p class="sub">เลือกหัวข้อที่ต้องการด้านล่าง</p>
    </section>

    <section class="links">
      <a class="link" href="https://metha9544.github.io/Order/?v=4" target="_blank" rel="noopener noreferrer">
        <div class="left">
          <div class="icon">🛍️</div>
          <div class="txt">
            <div class="title">สั่งซื้อสินค้า</div>
            <div class="desc">เลือกสินค้าและสั่งซื้อออนไลน์</div>
          </div>
        </div>
        <div class="arrow-link">›</div>
      </a>

      <a class="link" href="https://metha9544.github.io/print/" target="_blank" rel="noopener noreferrer">
        <div class="left">
          <div class="icon">🏷️</div>
          <div class="txt">
            <div class="title">สร้างใบปะหน้า</div>
            <div class="desc">สร้างและพิมพ์ใบปะหน้า</div>
          </div>
        </div>
        <div class="arrow-link">›</div>
      </a>

      <a class="link" href="https://lin.ee/yeEHSUi" target="_blank" rel="noopener noreferrer">
        <div class="left">
          <div class="icon">💬</div>
          <div class="txt">
            <div class="title">LINE</div>
            <div class="desc">ติดต่อร้านผ่าน LINE</div>
          </div>
        </div>
        <div class="arrow-link">›</div>
      </a>
    </section>

    <footer>METIST © 2026</footer>
  </main>
</body>
</html>
