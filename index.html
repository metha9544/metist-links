<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="METIST — ลิงก์สำหรับสั่งซื้อ สร้างใบปะหน้า และติดต่อร้าน">
  <title>METIST | Links</title>
  <style>
    :root{--bg:#f5f3ee;--card:#fff;--ink:#111;--muted:#6f6a61;--line:#d8d3ca}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#f7f5f0 0%,#eeeae2 100%);color:var(--ink);display:flex;justify-content:center;padding:28px 18px 40px}
    .wrap{width:100%;max-width:520px}
    .hero{text-align:center;padding:18px 10px 24px}
    .logo{width:92px;height:92px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;margin:0 auto 16px;font-size:26px;font-weight:700;letter-spacing:1px}
    h1{margin:0;font-size:28px;letter-spacing:.12em;font-weight:700}
    .sub{margin:10px auto 0;color:var(--muted);font-size:14px;line-height:1.55;max-width:360px}
    .links{display:grid;gap:12px}
    .link{display:flex;align-items:center;justify-content:space-between;gap:14px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;padding:17px 18px;box-shadow:0 6px 20px rgba(0,0,0,.035);transition:.18s ease}
    .link:active{transform:scale(.985)}
    .left{display:flex;align-items:center;gap:12px;min-width:0}
    .icon{width:38px;height:38px;border-radius:12px;background:#f0ede7;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
    .txt{min-width:0}
    .title{font-weight:650;font-size:16px}
    .desc{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .arrow{font-size:20px;color:#8a847a}
    footer{text-align:center;color:#928b80;font-size:11px;margin-top:26px}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="logo">M</div>
      <h1>METIST</h1>
      <p class="sub">เลือกหัวข้อที่ต้องการด้านล่าง</p>
    </section>

    <section class="links">
      <a class="link" href="https://metha9544.github.io/Order/?v=4" target="_blank" rel="noopener noreferrer">
        <div class="left"><div class="icon">🛍️</div><div class="txt"><div class="title">สั่งซื้อสินค้า</div><div class="desc">เลือกสินค้าและสั่งซื้อออนไลน์</div></div></div><div class="arrow">›</div>
      </a>

      <a class="link" href="https://metha9544.github.io/print/" target="_blank" rel="noopener noreferrer">
        <div class="left"><div class="icon">🏷️</div><div class="txt"><div class="title">สร้างใบปะหน้า</div><div class="desc">สร้างและพิมพ์ใบปะหน้า</div></div></div><div class="arrow">›</div>
      </a>

      <a class="link" href="https://lin.ee/yeEHSUi" target="_blank" rel="noopener noreferrer">
        <div class="left"><div class="icon">💬</div><div class="txt"><div class="title">LINE</div><div class="desc">ติดต่อร้านผ่าน LINE</div></div></div><div class="arrow">›</div>
      </a>
    </section>

    <footer>METIST © 2026</footer>
  </main>
</body>
</html>
